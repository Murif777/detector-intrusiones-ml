[theme]
# Tema oscuro de sala de control. El CSS de dashboard.py afina tipografia y
# componentes; aca se fija la paleta base que Streamlit aplica a todo.
base = "dark"
primaryColor = "#4C9AFF"
backgroundColor = "#0A0E13"
secondaryBackgroundColor = "#121922"
textColor = "#E6EDF3"
font = "sans serif"

[server]
headless = true
fileWatcherType = "auto"

[browser]
gatherUsageStats = false
