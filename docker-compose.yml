# Demo en vivo del NIDS: tres contenedores, un ataque real, captura real.
#
#     docker compose up            # usa la imagen publicada (cero setup)
#     docker compose up --build    # reconstruye desde el codigo local
#
# Topologia:
#
#     victim    (nginx)          red nidsnet
#     nids      (nuestro NIDS)   red nidsnet, CAP_NET_ADMIN, captura en eth0
#     attacker  (hping3/nmap)    COMPARTE el netns del NIDS
#
# Por que el atacante comparte el netns del NIDS (`network_mode: service:nids`):
# un bridge de Docker reenvia el trafico unicamente al puerto destino, asi que
# un tercer contenedor NO veria el ataque. Al compartir el espacio de red, los
# paquetes del atacante salen por la misma eth0 que el NIDS captura: la captura
# es real y funciona sin depender de configuracion de bridge ni de modo
# promiscuo.
#
# Requiere Docker corriendo. NO requiere permisos de admin en el host: las
# capacidades se conceden al contenedor, no al usuario.

services:
  victim:
    image: nginx:alpine
    container_name: nids-victim
    networks:
      - nidsnet
    # Sin puertos publicados: el trafico se queda dentro de la red del compose.

  nids:
    # La imagen publicada trae el modelo adentro. `build` queda como respaldo:
    # si no existe local, Docker la construye desde el codigo.
    image: ghcr.io/murif777/detector-intrusiones-ml:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.nids
    container_name: nids-detector
    networks:
      - nidsnet
    # CAP_NET_ADMIN: abrir la interfaz en modo promiscuo y capturar.
    # CAP_NET_RAW:   sockets crudos que scapy/libpcap necesitan.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      # Las alertas quedan en el host para que el dashboard las lea.
      # El modelo NO se monta: viene dentro de la imagen.
      - ./output:/app/output
      # Cambios en el script sin reconstruir la imagen (~6 min de build).
      - ./scripts/live_nids.py:/app/scripts/live_nids.py:ro
      # RUNTIME_PATH (metadata del umbral) vive en src/alerts.py.
      - ./src/alerts.py:/app/src/alerts.py:ro
      # Descarte de ACK/FIN tardios que creaban flujos fantasma.
      - ./src/features.py:/app/src/features.py:ro
    environment:
      # Override del umbral SOLO para la demo. demo-menu.ps1 lo setea en las
      # corridas que incluyen trafico normal (0.30) y lo deja vacio en las de
      # solo ataque. Vacio = umbral del artefacto (0.05), sin override.
      NIDS_THRESHOLD: "${NIDS_THRESHOLD:-}"
    # NIDS_DURATION=0 deja el detector indefinido (lo usa demo-menu.ps1 para
    # encadenar varios ataques). Sin la variable, 90 s como siempre.
    command: >
      python scripts/live_nids.py --iface eth0 --duration ${NIDS_DURATION:-90}

  attacker:
    image: ghcr.io/murif777/detector-intrusiones-ml-attacker:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.attacker
    container_name: nids-attacker
    # Comparte la pila de red del NIDS. Ver la nota de arriba.
    network_mode: "service:nids"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    depends_on:
      - nids
    environment:
      NIDS_WARMUP: "12"
      # `docker compose run -e ATTACK=1 attacker` sobrescribe este default.
      ATTACK: "${ATTACK:-all}"
    volumes:
      # Dockerfile.attacker copia el script a /attack.sh; se monta ahi mismo
      # para probar cambios sin reconstruir la imagen.
      - ./docker/attack.sh:/attack.sh:ro

  dashboard:
    # Panel web de alertas. Es la misma imagen del NIDS: ya trae streamlit, asi
    # que nadie necesita instalar Python para ver la visualizacion.
    image: ghcr.io/murif777/detector-intrusiones-ml:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.nids
    container_name: nids-dashboard
    networks:
      - nidsnet
    ports:
      - "8501:8501"
    volumes:
      # Lee el mismo store JSONL que escribe el NIDS.
      - ./output:/app/output
      # Cambios en el panel sin reconstruir la imagen.
      - ./dashboard.py:/app/dashboard.py:ro
      # RUNTIME_PATH (metadata del umbral) vive en src/alerts.py.
      - ./src/alerts.py:/app/src/alerts.py:ro
    environment:
      # El contenedor corre en UTC por defecto. Sin TZ, `astimezone()` mostraria
      # UTC y no la hora local de la demo. Se puede cambiar con DEMO_TZ.
      TZ: "${DEMO_TZ:-America/Bogota}"
    command: >
      streamlit run dashboard.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.headless true
      --browser.gatherUsageStats false
    depends_on:
      - nids

networks:
  nidsnet:
    driver: bridge